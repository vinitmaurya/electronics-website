<div class="container">
  <!-- Section Container -->
  <div class="section-container">
    <!-- Left Section -->
    <div class="left-section">
      <!-- Search Bar -->
      <div class="search-bar">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Search by name, category, or subcategory..."
          class="form-control search-input"
        />

        <select [(ngModel)]="selectedCategory" class="form-select category-dropdown">
          <option value="All">All</option>
          <option *ngFor="let category of productData | keyvalue" [value]="category.key">
            {{ category.key }}
          </option>
        </select>
      </div>

      <!-- Product List Accordion -->
      <div class="accordion" id="accordionCategories">
        <ng-container *ngIf="getFilteredProducts() as filteredSubcategories">
          <ng-container *ngFor="let subCategory of filteredSubcategories | keyvalue">
            <div class="accordion-item">
              <h2 class="accordion-header" id="heading{{ subCategory.key }}">
                <button
                  class="accordion-button"
                  type="button"
                  data-bs-toggle="collapse"
                  [attr.data-bs-target]="'#collapse' + subCategory.key"
                  [attr.aria-expanded]="true"
                  [attr.aria-controls]="'collapse' + subCategory.key"
                >
                  {{ subCategory.key }}
                </button>
              </h2>
              <div
                id="collapse{{ subCategory.key }}"
                class="accordion-collapse collapse show"
                [attr.aria-labelledby]="'heading' + subCategory.key"
                data-bs-parent="#accordionCategories"
              >
                <div class="accordion-body">
                  <div class="row row-cols-1 row-cols-md-3 g-4 product-list">
                    <ng-container *ngFor="let product of subCategory.value">
                      <div class="col">
                        <div class="card h-100 product-card">
                          <img [src]="product.imageUrl" [alt]="product.name" class="card-img-top product-image" />
                          <div class="card-body">
                            <h5 class="card-title product-name">{{ product.name }}</h5>
                            <p class="card-text product-description">{{ product.description }}</p>
                          </div>
                          <div class="card-footer">
                            <button
                              (click)="addToCart(product, product.quantity || 1)"
                              class="btn btn-success w-100 buy-now-btn"
                            >
                              Add to Cart
                            </button>
                          </div>
                        </div>
                      </div>
                    </ng-container>
                  </div>
                </div>
              </div>
            </div>
          </ng-container>
        </ng-container>
      </div>
    </div>

    <!-- Right Section -->
    <div class="right-section">
      <!-- Cart Section -->
      <div class="cart-section">
        <div class="cart-header">
          <h5>Cart</h5>
        </div>
        <div class="cart-items">
          <div *ngFor="let item of cart" class="mb-3">
            <div class="card">
              <div class="row g-0">
                <div class="col-3">
                  <img
                    [src]="item.product.imageUrl"
                    class="img-fluid rounded-start cart-item-image"
                    [alt]="item.product.name"
                  />
                </div>
                <div class="col-6">
                  <div class="card-body">
                    <h5 class="card-title">{{ item.product.name }}</h5>
                    <p class="card-text">Quantity: {{ item.quantity }}</p>
                  </div>
                </div>
                <div class="col-3 d-flex align-items-center justify-content-center">
                  <button
                    (click)="removeFromCart(item.product.id)"
                    class="btn btn-danger remove-btn"
                  >
                    Remove
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="cart-footer" *ngIf="cart.length > 0">
          <button
            (click)="showEnquiryForm = !showEnquiryForm"
            class="btn btn-primary enquiry-btn"
          >
            Send Enquiry for {{ cart.length }} items
          </button>
        </div>
        <div *ngIf="showEnquiryForm" class="enquiry-form">
          <input
            type="text"
            [(ngModel)]="contactDetails.mobile"
            placeholder="Mobile Number"
            class="form-control contact-input"
          />
          <input
            type="email"
            [(ngModel)]="contactDetails.email"
            placeholder="Email ID"
            class="form-control contact-input"
          />
          <div class="enquiry-button">
            <button (click)="submitEnquiry()" class="btn btn-primary enquiry-btn">
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
